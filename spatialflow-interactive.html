    --sans: 'DM Sans', system-ui, sans-serif;

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--sans); background:var(--bg); color:var(--text);
         height:100vh; display:grid; grid-template-columns:280px 1fr 280px; overflow:hidden; }

  .panel { background:var(--panel); border-right:1px solid var(--border);
            padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .panel.right { border-right:none; border-left:1px solid var(--border); }

  .ph { font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.1em;
        text-transform:uppercase; color:var(--accent); display:flex; align-items:center; gap:6px;
        margin-bottom:2px; }
  .ph::before { content:''; width:3px; height:12px; background:var(--accent); border-radius:2px; }

  .section { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:10px; }

  .scene-btn { font-family:var(--mono); font-size:11px; padding:8px 10px; background:var(--surface);
               border:1px solid var(--border); color:var(--dim); border-radius:4px; cursor:pointer;
               transition:all .15s; width:100%; text-align:left; display:flex; align-items:center; gap:8px; }
  .scene-btn:hover { color:var(--accent); border-color:var(--accent); }

  .scene-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  .sig-row { display:flex; justify-content:space-between; align-items:baseline;
             font-family:var(--mono); font-size:10px; padding:3px 0;
             border-bottom:1px solid rgba(255,255,255,.03); }
  .sig-name { color:var(--dim); }
  .sig-val { color:var(--accent2); font-size:10px; }

  .slider-wrap { display:flex; flex-direction:column; gap:4px; }
  .slider-wrap label { font-family:var(--mono); font-size:10px; color:var(--dim);
                        display:flex; justify-content:space-between; }
  .slider-wrap label span { color:var(--accent); }

                      border-radius:2px; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px;
                                             background:var(--accent); border-radius:50%; cursor:pointer; }

  .graph-entry { font-family:var(--mono); font-size:10px; line-height:1.7; }
  .ge-target { color:var(--text); }
  .ge-arrow { color:var(--dim); }
  .ge-sig { color:var(--accent2); }
  .ge-el { color:var(--accent); }

  .canvas-wrap { display:flex; flex-direction:column; background:#08080f; position:relative; }
  .toolbar { display:flex; align-items:center; gap:8px; padding:8px 14px;
             background:var(--panel); border-bottom:1px solid var(--border);
             font-family:var(--mono); font-size:10px; color:var(--dim); }
  .badge { background:var(--surface); border:1px solid var(--border);
           padding:2px 8px; border-radius:3px; font-size:9px; }
  .badge.live { color:var(--ok); border-color:rgba(80,232,144,.3); }
  canvas { display:block; flex:1; cursor:crosshair; }

  .viol { padding:3px 6px; margin:2px 0; border-radius:3px; }

         overflow-y:auto; background:rgba(0,0,0,.3); border:1px solid var(--border);
         border-radius:3px; padding:6px; white-space:pre; line-height:1.6; }

  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

<script>
// ============================================================================
// SpatialFlowLive — signal-driven runtime layer
// ============================================================================
class SpatialFlowLive extends SpatialFlowEngine {
  constructor(spec, canvas) {
    super(spec, canvas);
    this._sigs = {
      mouse:    { x: 480, y: 270 },
      scroll:   { x: 0,   y: 0 },
      viewport: { width: window.innerWidth, height: window.innerHeight },
      time:     { ms: 0,  s: 0,  norm: 0 }
    };
    this._customSigs = {};
    this._raf = null;
    this._playing = false;
    this._t0 = null;
    this._pausedAt = 0;
    this._onFrame = null;
    this._fps = 0;
    this._lastFpsTime = 0;
    this._frameCount = 0;
    this._bindEvents();
  }

  setCustomSignal(name, value) { this._customSigs[name] = value; }

  _signals() {
    return { ...this._sigs, ...this._customSigs };
  }

  _bindEvents() {
    const c = this.canvas;
    this._mm = (e) => {
      const r = c.getBoundingClientRect();
      this._sigs.mouse = {
        x: (e.clientX - r.left) * (c.width / r.width),
        y: (e.clientY - r.top)  * (c.height / r.height)
      };
    };
    c.addEventListener('mousemove', this._mm);
    this._rs = () => {
      this._sigs.viewport = { width: window.innerWidth, height: window.innerHeight };
    };
    window.addEventListener('resize', this._rs);
  }

  start(onFrame) {
    if (this._playing) return;
    this._playing = true;
    this._t0 = performance.now() - this._pausedAt;
    this._onFrame = onFrame;
    this._loop();
  }

  _loop() {
    this._raf = requestAnimationFrame(() => {
      if (!this._playing) return;
      const now = performance.now();
      const elapsed = now - this._t0;
      const dur = this.spec.metadata?.duration || 8000;
      const t = elapsed % dur;

      this._sigs.time = { ms: t, s: t / 1000, norm: t / dur };

      const state = this.renderFrame(t, this._signals());
      if (this._onFrame) this._onFrame(state, t, this._signals());

      // FPS
      this._frameCount++;
      if (now - this._lastFpsTime >= 1000) {
        this._fps = this._frameCount;
        this._frameCount = 0;
        this._lastFpsTime = now;
      }

      this._loop();
    });
  }

  pause() {
    this._playing = false;
    this._pausedAt = performance.now() - this._t0;
    cancelAnimationFrame(this._raf);
  }

  destroy() {
    this.pause();
    this.canvas.removeEventListener('mousemove', this._mm);
    window.removeEventListener('resize', this._rs);
  }
}

// ============================================================================
// UI
// ============================================================================
const scenes = { cascade: SCENE_CASCADE, orbit: SCENE_ORBIT, reflow: SCENE_REFLOW };
const SIGNAL_NAMES = ['mouse', 'scroll', 'viewport', 'time', 'container'];

let live = null;
let currentScene = 'cascade';
let fpsT = 0;

function buildSigRow(name, val) {
  const fmt = (v) => {
    if (typeof v === 'object') return Object.entries(v).map(([k,vv]) => `${k}:${typeof vv === 'number' ? vv.toFixed(0) : vv}`).join(' ');
    return String(v);
  };
  return `<div class="sig-row"><span class="sig-name">${name}</span><span class="sig-val">${fmt(val)}</span></div>`;
}

function updateSigMonitor(sigs) {
  const box = document.getElementById('sigMonitor');
  box.innerHTML = Object.entries(sigs).map(([k, v]) => buildSigRow(k, v)).join('');
}

function buildGraph(engine, sigs) {
  const g = engine.getDependencyGraph(Object.keys(sigs));
  const graphBox = document.getElementById('graphBox');
  const sigDepBox = document.getElementById('sigDepBox');

  let graphHtml = '', sigDepHtml = '';
  for (const [target, deps] of Object.entries(g)) {
    if (deps.elements.length > 0) {
      graphHtml += `<div class="graph-entry"><span class="ge-target">${target}</span> <span class="ge-arrow">←</span> ${deps.elements.map(e => `<span class="ge-el">${e}</span>`).join(', ')}</div>`;
    }
    if (deps.signals.length > 0) {
      sigDepHtml += `<div class="graph-entry"><span class="ge-target">${target}</span> <span class="ge-arrow">←</span> ${deps.signals.map(s => `<span class="ge-sig">${s}</span>`).join(', ')}</div>`;
    }
  }

  graphBox.innerHTML  = graphHtml  || '<span style="color:var(--dim);font-family:var(--mono);font-size:10px">No element deps</span>';
  sigDepBox.innerHTML = sigDepHtml || '<span style="color:var(--dim);font-family:var(--mono);font-size:10px">No signal deps</span>';
}

function updateViolations(violations) {
  const box = document.getElementById('violationsBox');
  if (!violations.length) {
    box.innerHTML = '<span style="color:var(--dim);font-family:var(--mono);font-size:10px">None</span>';
    return;
  }
  box.innerHTML = violations.map(v => {
    if (v.type === 'overflow') return `<div class="viol overflow">overflow: ${v.elementId}</div>`;
    if (v.type === 'overlap')  return `<div class="viol overlap">overlap: ${v.elements.join(' + ')}</div>`;
    return '';
  }).join('');
}

function buildSceneControls(scene) {
  const el = document.getElementById('sceneControls');
  if (scene === 'cascade') {
    el.innerHTML = `
      <div class="ph" style="margin-top:4px">Chain Controls</div>
      <div class="section slider-wrap">
        <label>Box gap <span id="gapVal">10</span>px
          <input type="range" id="gapSlider" min="0" max="60" value="10"/>
        </label>
      </div>`;
    document.getElementById('gapSlider').addEventListener('input', function() {
      const gap = +this.value;
      document.getElementById('gapVal').textContent = gap;
      if (!live) return;
      // Update gap in all chain constraints
      const cs = live.spec.constraints;
      ['box1','box2','box3','box4','box5'].forEach((id, i) => {
        const prev = i === 0 ? 'box0' : `box${i}`;
        const c = cs.find(c => c.target === id);
        if (c) c.x = `${prev}.bounds.right + ${gap}`;
      });
    });
  } else if (scene === 'reflow') {
    el.innerHTML = `
      <div class="ph" style="margin-top:4px">Container</div>
      <div class="section slider-wrap">
        <label>Width <span id="cwVal">760</span>px
          <input type="range" id="cwSlider" min="300" max="880" value="760"/>
        </label>
        <label>Start <span id="csVal">80</span>px
          <input type="range" id="csSlider" min="20" max="200" value="80"/>
        </label>
      </div>`;
    const update = () => {
      const w = +document.getElementById('cwSlider').value;
      const s = +document.getElementById('csSlider').value;
      document.getElementById('cwVal').textContent = w;
      document.getElementById('csVal').textContent = s;
      if (live) live.setCustomSignal('container', { width: w, start: s });
      // Update the width_label text dynamically
      const wlEl = live?.spec.elements.find(e => e.id === 'width_label');
      if (wlEl) wlEl.content = `width: ${w}`;
    };
    document.getElementById('cwSlider').addEventListener('input', update);
    document.getElementById('csSlider').addEventListener('input', update);
    // Init
    if (live) live.setCustomSignal('container', { width: 760, start: 80 });
  } else {
    el.innerHTML = '';
  }
}

function startScene(sceneName) {
  if (live) live.destroy();
  currentScene = sceneName;

  const spec = JSON.parse(JSON.stringify(scenes[sceneName]));
  const canvas = document.getElementById('c');
  live = new SpatialFlowLive(spec, canvas);

  // Init custom signals per scene
  if (sceneName === 'reflow') {
    live.setCustomSignal('container', { width: 760, start: 80 });
  }

  // Update toolbar counts
  document.getElementById('elemCount').textContent       = `${spec.elements.length} el`;
  document.getElementById('constraintCount').textContent = `${spec.constraints?.length ?? 0} constraints`;

  // Build initial graph
  buildGraph(live, { mouse:1, scroll:1, viewport:1, time:1, container:1 });

  // Scene controls
  buildSceneControls(sceneName);

  let frameN = 0;
  live.start((state, t, sigs) => {
    // Signal monitor (every 2 frames to avoid jank)
    if (frameN % 2 === 0) updateSigMonitor(sigs);

    // Violations
    if (frameN % 10 === 0) updateViolations(state.violations);

    // FPS
    const fpsEl = document.getElementById('fpsEl');
    if (live._fps > 0) fpsEl.textContent = `${live._fps} fps`;

    // Eval log (every 30 frames)
    if (frameN % 30 === 0) {
      const constCount = state.constraints?.length ?? 0;
      const sigCount = Object.keys(sigs).length;
      const log = document.getElementById('evalLog');
      log.textContent = [
        `t        : ${t.toFixed(0)} ms`,
        `signals  : ${sigCount} roots`,
        `elements : ${state.elements.length}`,
        `constraints: ${constCount}`,
        `eval order: [${state.order?.slice(0,6).join(', ')}${state.order?.length > 6 ? '…' : ''}]`,
        `violations: ${state.violations.length}`,
        `mouse    : (${sigs.mouse?.x?.toFixed(0)}, ${sigs.mouse?.y?.toFixed(0)})`,
      ].join('\n');
    }

    frameN++;
  });
}

// Scene button handlers
document.querySelectorAll('.scene-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    startScene(btn.dataset.scene);
  });
});

// Boot
startScene('cascade');
</script>
