<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>SpatialFlow — Slide Deck Engine</title>
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0d0d14;
    --panel: #111119;
    --border: #1c1c2e;
    --surface: #16162a;
    --text: #c8c8d8;
    --text-dim: #6a6a80;
    --accent: #7eb8ff;
    --accent2: #4ecdc4;
    --warn: #ff6b6b;
    --success: #50e890;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: grid; grid-template-columns: 320px 1fr 320px; overflow: hidden; }

  /* --- Left panel: controls --- */
  .panel { background: var(--panel); border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .panel:last-child { border-right: none; border-left: 1px solid var(--border); }

  .panel-header { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .panel-header::before { content: ''; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }

  h1 { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }

  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { font-family: var(--mono); font-size: 11px; padding: 6px 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(126,184,255,0.06); }
  .btn.active { color: var(--accent); border-color: var(--accent); background: rgba(126,184,255,0.1); }

  label { display: block; font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
  label span.val { color: var(--accent); float: right; }

  select, input[type=range] { width: 100%; margin-top: 4px; }
  select { font-family: var(--mono); font-size: 11px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 4px; }
  input[type=range] { -webkit-appearance: none; height: 4px; background: var(--border); border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; cursor: pointer; }

  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
  .section-title { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; }

  .controls-group { display: flex; flex-direction: column; gap: 8px; }

  /* --- Center: canvas --- */
  .canvas-wrap { display: flex; flex-direction: column; background: #0a0a10; position: relative; }
  .canvas-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .canvas-toolbar .badge { background: var(--surface); border: 1px solid var(--border); padding: 2px 8px; border-radius: 3px; font-size: 10px; }
  .badge.pretext { color: var(--success); border-color: rgba(80,232,144,0.3); }
  .badge.canvas { color: var(--warn); border-color: rgba(255,107,107,0.3); }
  canvas { display: block; flex: 1; cursor: crosshair; }

  /* --- Right panel: inspector + command --- */
  .log-box { font-family: var(--mono); font-size: 10px; line-height: 1.5; color: var(--text-dim); background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 4px; padding: 8px; height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }

  .violation { font-family: var(--mono); font-size: 10px; padding: 4px 8px; margin: 2px 0; border-radius: 3px; }
  .violation.overflow { background: rgba(255,107,107,0.08); border-left: 2px solid var(--warn); color: var(--warn); }
  .violation.overlap { background: rgba(255,180,50,0.08); border-left: 2px solid #ffb432; color: #ffb432; }

  .graph-box { font-family: var(--mono); font-size: 10px; color: var(--text-dim); background: rgba(126,184,255,0.03); border: 1px solid rgba(126,184,255,0.1); border-radius: 4px; padding: 8px; height: 140px; overflow-y: auto; white-space: pre-wrap; }

  /* Command input */
  .cmd-input-wrap { display: flex; gap: 6px; }
  .cmd-input { flex: 1; font-family: var(--mono); font-size: 11px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 4px; outline: none; resize: vertical; min-height: 60px; }
  .cmd-input:focus { border-color: var(--accent); }
  .cmd-send { font-family: var(--mono); font-size: 11px; padding: 8px 14px; background: rgba(126,184,255,0.1); border: 1px solid rgba(126,184,255,0.3); color: var(--accent); border-radius: 4px; cursor: pointer; align-self: flex-end; }
  .cmd-send:hover { background: rgba(126,184,255,0.2); }

  .cmd-log { font-family: var(--mono); font-size: 10px; color: var(--text-dim); max-height: 100px; overflow-y: auto; }
  .cmd-log .ok { color: var(--success); }
  .cmd-log .err { color: var(--warn); }

  .stat { display: inline-flex; align-items: center; gap: 4px; }
  .stat-dot { width: 6px; height: 6px; border-radius: 50%; }
  .stat-dot.on { background: var(--success); box-shadow: 0 0 6px rgba(80,232,144,0.5); }
  .stat-dot.off { background: var(--warn); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- LEFT PANEL -->
<div class="panel" id="leftPanel">
  <h1>Spatial<span>Flow</span> v2</h1>

  <div class="section">
    <div class="section-title">Demo</div>
    <select id="demoSelect">
      <option value="slide">Slide: title + body + image</option>
      <option value="threeCol">3-Column Comparison</option>
      <option value="hero">Hero: box + dot + label</option>
      <option value="chain">Chain: N linked boxes</option>
      <option value="grid">Grid: rows × cols</option>
      <option value="autoframe">Auto-Layout Frame</option>
      <option value="connector">Connectors</option>
    </select>
  </div>

  <div class="section">
    <div class="section-title">Playback</div>
    <div class="btn-row">
      <button class="btn" id="playBtn">▶ Play</button>
      <button class="btn" id="pauseBtn">⏸ Pause</button>
      <button class="btn" id="seekBtn">↺ Reset</button>
    </div>
    <label style="margin-top:8px">Duration (ms) <span class="val" id="durVal">3000</span>
      <input id="duration" type="range" min="0" max="8000" step="100" value="3000"/>
    </label>
  </div>

  <div class="section" id="heroControls" style="display:none">
    <div class="section-title">Hero Controls</div>
    <div class="controls-group">
      <label>Travel (px) <span class="val" id="travelVal">250</span>
        <input id="travel" type="range" min="50" max="600" step="10" value="250"/>
      </label>
      <label>Dot offset <span class="val" id="offsetVal">30</span>
        <input id="offset" type="range" min="-100" max="200" step="5" value="30"/>
      </label>
    </div>
  </div>

  <div class="section" id="chainControls" style="display:none">
    <div class="section-title">Chain Controls</div>
    <div class="controls-group">
      <label>Count <span class="val" id="chainCountVal">8</span>
        <input id="chainCount" type="range" min="2" max="20" step="1" value="8"/>
      </label>
      <label>Gap <span class="val" id="chainGapVal">20</span>
        <input id="chainGap" type="range" min="0" max="80" step="2" value="20"/>
      </label>
    </div>
  </div>

  <div class="section" id="gridControls" style="display:none">
    <div class="section-title">Grid Controls</div>
    <div class="controls-group">
      <label>Rows <span class="val" id="gridRowsVal">3</span><input id="gridRows" type="range" min="1" max="10" value="3"/></label>
      <label>Cols <span class="val" id="gridColsVal">4</span><input id="gridCols" type="range" min="1" max="10" value="4"/></label>
      <label>Row gap <span class="val" id="rowGapVal">16</span><input id="rowGap" type="range" min="0" max="80" step="2" value="16"/></label>
      <label>Col gap <span class="val" id="colGapVal">16</span><input id="colGap" type="range" min="0" max="80" step="2" value="16"/></label>
    </div>
  </div>

  <div class="section" id="slideControls">
    <div class="section-title">Slide Controls</div>
    <div class="controls-group">
      <label>Text width <span class="val" id="slideTextWidthVal">360</span><input id="slideTextWidth" type="range" min="150" max="600" step="10" value="360"/></label>
      <label>Title size <span class="val" id="slideTitleSizeVal">28</span><input id="slideTitleSize" type="range" min="12" max="72" step="1" value="28"/></label>
      <label>Body size <span class="val" id="slideBodySizeVal">16</span><input id="slideBodySize" type="range" min="10" max="36" step="1" value="16"/></label>
    </div>
  </div>

  <div class="section" id="frameControls" style="display:none">
    <div class="section-title">Frame Controls</div>
    <div class="controls-group">
      <label>Spacing <span class="val" id="frameSpacingVal">16</span><input id="frameSpacing" type="range" min="0" max="60" step="2" value="16"/></label>
      <label>Padding <span class="val" id="framePaddingVal">20</span><input id="framePadding" type="range" min="0" max="60" step="2" value="20"/></label>
      <label>Direction
        <select id="frameDir"><option value="horizontal">Horizontal</option><option value="vertical" selected>Vertical</option></select>
      </label>
      <label>Primary align
        <select id="framePrimary"><option value="start" selected>Start</option><option value="center">Center</option><option value="end">End</option><option value="space-between">Space-between</option></select>
      </label>
      <label>Counter align
        <select id="frameCounter"><option value="start" selected>Start</option><option value="center">Center</option><option value="end">End</option><option value="stretch">Stretch</option></select>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Display</div>
    <div class="controls-group">
      <label><input type="checkbox" id="showDag" checked/> Show DAG overlay</label>
      <label><input type="checkbox" id="showBounds"/> Show bounds</label>
      <label><input type="checkbox" id="showViolations" checked/> Highlight violations</label>
    </div>
  </div>
</div>

<!-- CENTER: CANVAS -->
<div class="canvas-wrap">
  <div class="canvas-toolbar">
    <span>SpatialFlow v2</span>
    <span class="badge" id="textEngineBadge">—</span>
    <span style="flex:1"></span>
    <span id="fpsDisplay">— fps</span>
    <span>|</span>
    <span id="elemCount">0 elements</span>
    <span>|</span>
    <span id="constraintCount">0 constraints</span>
  </div>
  <canvas id="c" width="960" height="540"></canvas>
</div>

<!-- RIGHT PANEL -->
<div class="panel" id="rightPanel">
  <div class="panel-header">Inspector</div>
  <div class="section">
    <div class="section-title">Hovered element</div>
    <div class="log-box" id="inspectorBox">Hover over an element on the canvas</div>
  </div>

  <div class="panel-header">Constraint graph</div>
  <div class="graph-box" id="graphBox"></div>

  <div class="panel-header">Violations</div>
  <div id="violationsBox" style="max-height:100px; overflow-y:auto; font-size:11px;">
    <em style="color:var(--text-dim); font-family:var(--mono); font-size:10px;">None</em>
  </div>

  <div class="panel-header">Mode C — Commands</div>
  <textarea class="cmd-input" id="cmdInput" placeholder='{"type":"add_element","element":{"id":"box1","type":"rectangle","x":100,"y":100,"width":80,"height":60,"fill":"#4ecdc4"}}'></textarea>
  <button class="cmd-send" id="cmdSend">Execute ▶</button>
  <div class="cmd-log" id="cmdLog"></div>
</div>

<script>
// Pretext text measurement library (bundled)
// By Cheng Lou - https://github.com/chenglou/pretext
(function(global){
// --- bidi.js ---
// Simplified bidi metadata helper for the rich prepareWithSegments() path,
// forked from pdf.js via Sebastian's text-layout. It classifies characters
// into bidi types, computes embedding levels, and maps them onto prepared
// segments for custom rendering. The line-breaking engine does not consume
// these levels.
const baseTypes = [

    'B', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN',
    'BN', 'BN', 'B', 'B', 'B', 'S', 'WS', 'ON', 'ON', 'ET', 'ET', 'ET', 'ON',
    'ON', 'ON', 'ON', 'ON', 'ON', 'CS', 'ON', 'CS', 'ON', 'EN', 'EN', 'EN',
    'EN', 'EN', 'EN', 'EN', 'EN', 'EN', 'EN', 'ON', 'ON', 'ON', 'ON', 'ON',
    'ON', 'ON', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L',
    'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'ON', 'ON',
    'ON', 'ON', 'ON', 'ON', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L',
    'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L',
    'L', 'ON', 'ON', 'ON', 'ON', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'B', 'BN',
    'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN',
    'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN',
    'BN', 'CS', 'ON', 'ET', 'ET', 'ET', 'ET', 'ON', 'ON', 'ON', 'ON', 'L', 'ON',
    'ON', 'ON', 'ON', 'ON', 'ET', 'ET', 'EN', 'EN', 'ON', 'L', 'ON', 'ON', 'ON',
    'EN', 'L', 'ON', 'ON', 'ON', 'ON', 'ON', 'L', 'L', 'L', 'L', 'L', 'L', 'L',
    'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L',
    'L', 'ON', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L',
    'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L',
    'L', 'L', 'L', 'ON', 'L', 'L', 'L', 'L', 'L', 'L', 'L', 'L'
];
const arabicTypes = [
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'CS', 'AL', 'ON', 'ON', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM',
    'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AN', 'AN', 'AN', 'AN', 'AN', 'AN', 'AN', 'AN', 'AN',
    'AN', 'ET', 'AN', 'AN', 'AL', 'AL', 'AL', 'NSM', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',
    'AL', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM',
    'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'NSM', 'ON', 'NSM',
    'NSM', 'NSM', 'NSM', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL', 'AL',

function classifyChar(charCode) {
    if (charCode <= 0x00ff)
        return baseTypes[charCode];
    if (0x0590 <= charCode && charCode <= 0x05f4)
        return 'R';

    const types = new Array(len);
    let numBidi = 0;
    for (let i = 0; i < len; i++) {
        const t = classifyChar(str.charCodeAt(i));

        return null;

        const after = end < len ? types[end] : sor;

    }

        const t = types[i];

    const bidiLevels = computeBidiLevels(normalized);

        return null;

    for (let i = 0; i < segStarts.length; i++) {
        segLevels[i] = bidiLevels[segStarts[i]];
    }
    return segLevels;
}

// --- analysis.js ---
const collapsibleWhitespaceRunRe = /[ \t\n\r\f]+/g;
const needsWhitespaceNormalizationRe = /[\t\n\r\f]| {2,}|^ | $/;

    const mode = whiteSpace ?? 'normal';
    return mode === 'pre-wrap'
        ? { mode, preserveOrdinarySpaces: true, preserveHardBreaks: true }
        : { mode, preserveOrdinarySpaces: false, preserveHardBreaks: false };

    if (!needsWhitespaceNormalizationRe.test(text))

      return { x, y, x2, y2, bounds: { left: Math.min(x, x2), right: Math.max(x, x2), top: Math.min(y, y2), bottom: Math.max(y, y2) }, centerX: (x + x2) / 2, centerY: (y + y2) / 2 };
    }
    case 'connector': {
      // Connectors resolve position from source/target elements during constraint phase
      return { x, y, x2: el.x2 || x, y2: el.y2 || y, bounds: { left: x, right: x, top: y, bottom: y }, centerX: x, centerY: y };
    }
    case 'group': {
      // Groups get their bounds from children — computed after children are measured
      return { x, y, width: w, height: h, bounds: { left: x, right: x + w, top: y, bottom: y + h }, centerX: x + w / 2, centerY: y + h / 2 };
    }
    default: {
      return { x, y, width: w, height: h, bounds: { left: x, right: x + w, top: y, bottom: y + h }, centerX: x + w / 2, centerY: y + h / 2 };
    }
  }
}

// --- Violation detection ---------------------------------------------------
function detectViolations(measurements, spec) {
  const violations = [];
  const slideW = spec.metadata?.width || 960;
  const slideH = spec.metadata?.height || 540;

  for (const el of spec.elements) {
    const m = measurements[el.id];
    if (!m) continue;
    const b = m.bounds;

    // Overflow: element extends beyond slide bounds
    if (b.right > slideW || b.bottom > slideH || b.left < 0 || b.top < 0) {
      violations.push({ type: 'overflow', elementId: el.id, bounds: b, slideWidth: slideW, slideHeight: slideH });
    }
  }

  // Overlap detection
  const ids = spec.elements.map(e => e.id);
  for (let i = 0; i < ids.length; i++) {
    for (let j = i + 1; j < ids.length; j++) {
      const ma = measurements[ids[i]], mb = measurements[ids[j]];
      if (!ma?.bounds || !mb?.bounds) continue;
      const ix = Math.max(0, Math.min(ma.bounds.right, mb.bounds.right) - Math.max(ma.bounds.left, mb.bounds.left));
      const iy = Math.max(0, Math.min(ma.bounds.bottom, mb.bounds.bottom) - Math.max(ma.bounds.top, mb.bounds.top));
      if (ix > 0 && iy > 0) {
        violations.push({ type: 'overlap', elements: [ids[i], ids[j]], area: ix * iy });
      }
    }
  }

  return violations;
}

// --- Main engine -----------------------------------------------------------
class SpatialFlowEngine {
  constructor(spec, canvas) {
    this.spec = JSON.parse(JSON.stringify(spec));
    this.canvas = canvas;
    this.ctx = canvas ? canvas.getContext('2d') : null;
    this.textMeasurer = new TextMeasurer();
    this.time = new Signal(0);
    this._imageCache = new Map();
    this._commandLog = [];
  }

  // Core evaluation: animation → measure → topo-sort → constrain → re-measure
  evaluate(t) {
    const { elements, animations = [], constraints = [] } = this.spec;

    // Phase 1: Resolve animations
    const animState = {};
    for (const a of animations) {
      const v = interpKeyframes(a.keyframes || [], t, a.easing || 'linear');
      const tid = a.target || a.targetId;
      if (!animState[tid]) animState[tid] = {};
      animState[tid][a.property] = v;
    }

    // Phase 2: Initial measurement (pre-constraint)
    const measurements = {};
    for (const el of elements) {
      measurements[el.id] = measureElement(el, animState, this.textMeasurer, this.ctx);
    }

    // Phase 2.5: Resolve auto-layout frames
    const frames = elements.filter(e => e.type === 'frame' && e.children?.length > 0);
    for (const frame of frames) {
      const childLayouts = resolveAutoLayout(frame, measurements, elements);
      for (const [childId, layout] of Object.entries(childLayouts)) {
        // Convert frame-local coords to absolute
        const fm = measurements[frame.id];
        if (!animState[childId]) animState[childId] = {};
        animState[childId].x = fm.x + layout.x;
        animState[childId].y = fm.y + layout.y;
        if (layout.width) animState[childId].width = layout.width;
        if (layout.height) animState[childId].height = layout.height;
        // Re-measure with new position
        const el = elements.find(e => e.id === childId);
        if (el) {
          measurements[childId] = measureElement(el, animState, this.textMeasurer, this.ctx);
        }
      }
    }

    // Phase 2.7: Resolve connectors
    for (const el of elements) {
      if (el.type === 'connector' && el.from && el.to) {
        const fromM = measurements[el.from];
        const toM = measurements[el.to];
        if (fromM && toM) {
          const fromSite = getConnectionSite(fromM, el.fromSite || 'right');
          const toSite = getConnectionSite(toM, el.toSite || 'left');
          measurements[el.id] = {
            x: fromSite.x, y: fromSite.y,
            x2: toSite.x, y2: toSite.y,
            bounds: {
              left: Math.min(fromSite.x, toSite.x), right: Math.max(fromSite.x, toSite.x),
              top: Math.min(fromSite.y, toSite.y), bottom: Math.max(fromSite.y, toSite.y)
            },
            centerX: (fromSite.x + toSite.x) / 2,
            centerY: (fromSite.y + toSite.y) / 2
          };
        }
      }
    }

    // Phase 3: Topological sort + constraint resolution
    const order = topoOrder(elements, constraints);
    const resolvedState = JSON.parse(JSON.stringify(animState));
    const evalCtx = { measurements };

    for (const id of order) {
      const c = constraints.find(cc => cc.target === id);
      if (!c) continue;
      if (!resolvedState[id]) resolvedState[id] = {};

      if (c.x) resolvedState[id].x = evalExpr(c.x, evalCtx);
      if (c.y) resolvedState[id].y = evalExpr(c.y, evalCtx);
      if (c.width) resolvedState[id].width = evalExpr(c.width, evalCtx);
      if (c.height) resolvedState[id].height = evalExpr(c.height, evalCtx);

      // Phase 4: Re-measure with resolved position (single-pass guarantee)
      const el = elements.find(e => e.id === id);
      if (el) {
        const merged = { ...el, ...resolvedState[id] };
        measurements[id] = measureElement(merged, { [id]: resolvedState[id] }, this.textMeasurer, this.ctx);
      }
    }

    // Phase 5: Resolve group bounds from children
    for (const el of elements) {
      if (el.type === 'group' && el.children?.length) {
        let gl = Infinity, gt = Infinity, gr = -Infinity, gb = -Infinity;
        for (const cid of el.children) {
          const cm = measurements[cid];
          if (!cm?.bounds) continue;
          gl = Math.min(gl, cm.bounds.left);
          gt = Math.min(gt, cm.bounds.top);
          gr = Math.max(gr, cm.bounds.right);
          gb = Math.max(gb, cm.bounds.bottom);
        }
        if (gl !== Infinity) {
          measurements[el.id] = {
            x: gl, y: gt, width: gr - gl, height: gb - gt,
            bounds: { left: gl, right: gr, top: gt, bottom: gb },
            centerX: (gl + gr) / 2, centerY: (gt + gb) / 2
          };
        }
      }
    }

    // Phase 6: Detect violations
    const violations = detectViolations(measurements, this.spec);

    return { time: t, elements, state: resolvedState, measurements, constraints, order, violations };
  }

  evaluateExpression(expr, measurements) {
    return evalExpr(expr, { measurements });
  }

  // --- Rendering -----------------------------------------------------------
  renderFrame(t) {
    const s = this.evaluate(t);
    if (!this.ctx) return s;
    const ctx = this.ctx;
    const w = this.canvas.width, h = this.canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.fillStyle = this.spec.metadata?.background || '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.restore();

    // Render in z-order (array order)
    for (const el of s.elements) {
      const m = s.measurements[el.id];
      if (!m) continue;
      this._renderElement(el, m, s);
    }
    return s;
  }

  _renderElement(el, m, state) {
    const ctx = this.ctx;
    switch (el.type) {
      case 'rectangle':
      case 'frame': {
        ctx.save();
        if (el.fill) { ctx.fillStyle = el.fill; ctx.fillRect(m.x, m.y, m.width, m.height); }
        if (el.stroke) {
          ctx.strokeStyle = el.stroke;
          ctx.lineWidth = el.stroke_width || 1;
          ctx.strokeRect(m.x, m.y, m.width, m.height);
        }
        if (el.type === 'frame' && !el.fill && !el.stroke) {
          ctx.strokeStyle = '#ddd';
          ctx.setLineDash([4, 4]);
          ctx.strokeRect(m.x, m.y, m.width, m.height);
          ctx.setLineDash([]);
        }
        ctx.restore();
        break;
      }
      case 'circle': {
        ctx.save();
        ctx.fillStyle = el.fill || '#ff6b6b';
        ctx.beginPath();
        ctx.arc(m.x, m.y, el.radius || 10, 0, Math.PI * 2);
        ctx.fill();
        if (el.stroke) { ctx.strokeStyle = el.stroke; ctx.lineWidth = el.stroke_width || 1; ctx.stroke(); }
        ctx.restore();
        break;
      }
      case 'text': {
        ctx.save();
        ctx.font = el.font || '16px Inter';
        ctx.fillStyle = el.color || '#333';
        ctx.fillText(el.content || '', m.x, m.y);
        ctx.restore();
        break;
      }
      case 'text_box': {
        ctx.save();
        ctx.font = m.font || '16px Inter';
        ctx.fillStyle = el.color || '#111';
        const lh = m.lineHeight || 20;
        const lines = m.lines || [];
        for (let i = 0; i < lines.length; i++) {
          ctx.fillText(lines[i], m.x, m.y + (i + 1) * lh - lh * 0.2);
        }
        if (el.stroke_box) {
          ctx.strokeStyle = el.stroke_box;
          ctx.strokeRect(m.x, m.y, m.width, m.height);
        }
        ctx.restore();
        break;
      }
      case 'image': {
        ctx.save();
        const img = this._getImage(el.src);
        if (img?.complete && img.naturalWidth) {
          const fit = el.fit || 'contain';
          const iw = img.naturalWidth, ih = img.naturalHeight;
          const rw = m.width / iw, rh = m.height / ih;
          let dw, dh;
          if (fit === 'fill') { dw = m.width; dh = m.height; }
          else if (fit === 'cover') { const r = Math.max(rw, rh); dw = iw * r; dh = ih * r; }
          else { const r = Math.min(rw, rh); dw = iw * r; dh = ih * r; }
          ctx.drawImage(img, m.x + (m.width - dw) / 2, m.y + (m.height - dh) / 2, dw, dh);
        } else {
          ctx.strokeStyle = '#ccc';
          ctx.strokeRect(m.x, m.y, m.width, m.height);
          ctx.fillStyle = '#eee';
          ctx.font = '12px Inter';
          ctx.fillText('Loading...', m.x + 4, m.y + 16);
        }
        ctx.restore();
        break;
      }
      case 'connector': {
        ctx.save();
        ctx.strokeStyle = el.stroke || '#666';
        ctx.lineWidth = el.stroke_width || 2;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        // Bezier curve for connectors
        if (el.curveType === 'straight') {
          ctx.lineTo(m.x2, m.y2);
        } else {
          const midX = (m.x + m.x2) / 2;
          ctx.bezierCurveTo(midX, m.y, midX, m.y2, m.x2, m.y2);
        }
        ctx.stroke();
        // Arrow head
        if (el.arrow !== false) {
          const angle = Math.atan2(m.y2 - m.y, m.x2 - m.x);
          const sz = 8;
          ctx.beginPath();
          ctx.moveTo(m.x2, m.y2);
          ctx.lineTo(m.x2 - sz * Math.cos(angle - Math.PI / 6), m.y2 - sz * Math.sin(angle - Math.PI / 6));
          ctx.lineTo(m.x2 - sz * Math.cos(angle + Math.PI / 6), m.y2 - sz * Math.sin(angle + Math.PI / 6));
          ctx.closePath();
          ctx.fillStyle = el.stroke || '#666';
          ctx.fill();
        }
        ctx.restore();
        break;
      }
      case 'line': {
        ctx.save();
        ctx.strokeStyle = el.stroke || '#333';
        ctx.lineWidth = el.stroke_width || 2;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x2, m.y2);
        ctx.stroke();
        ctx.restore();
        break;
      }
      // group renders nothing itself — children render individually
    }
  }

  _getImage(src) {
    if (!src) return null;
    if (this._imageCache.has(src)) return this._imageCache.get(src);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = src;
    this._imageCache.set(src, img);
    return img;
  }

  // --- Mode C: Command protocol -------------------------------------------
  executeCommand(cmd) {
    const result = { success: false, violations: [], message: '' };
    try {
      switch (cmd.type) {
        case 'add_element': {
          const el = cmd.element;
          if (!el?.id || !el?.type) { result.message = 'Element requires id and type'; return result; }
          if (this.spec.elements.find(e => e.id === el.id)) { result.message = `Element ${el.id} already exists`; return result; }
          this.spec.elements.push(el);
          result.success = true;
          result.message = `Added ${el.type} "${el.id}"`;
          break;
        }
        case 'remove_element': {
          const idx = this.spec.elements.findIndex(e => e.id === cmd.elementId);
          if (idx === -1) { result.message = `Element ${cmd.elementId} not found`; return result; }
          this.spec.elements.splice(idx, 1);
          // Remove constraints targeting this element
          this.spec.constraints = (this.spec.constraints || []).filter(c => c.target !== cmd.elementId);
          result.success = true;
          result.message = `Removed "${cmd.elementId}"`;
          break;
        }
        case 'update_element': {
          const el = this.spec.elements.find(e => e.id === cmd.elementId);
          if (!el) { result.message = `Element ${cmd.elementId} not found`; return result; }
          Object.assign(el, cmd.props);
          result.success = true;
          result.message = `Updated "${cmd.elementId}"`;
          break;
        }
        case 'add_constraint': {
          if (!this.spec.constraints) this.spec.constraints = [];
          const existing = this.spec.constraints.find(c => c.target === cmd.constraint.target);
          if (existing) {
            Object.assign(existing, cmd.constraint);
          } else {
            this.spec.constraints.push(cmd.constraint);
          }
          result.success = true;
          result.message = `Constraint set for "${cmd.constraint.target}"`;
          break;
        }
        case 'set_layout': {
          // Apply a named layout template
          result.success = true;
          result.message = `Layout applied: ${cmd.layout}`;
          break;
        }
        case 'add_animation': {
          if (!this.spec.animations) this.spec.animations = [];
          this.spec.animations.push(cmd.animation);
          result.success = true;
          result.message = `Animation added for "${cmd.animation.target}"`;
          break;
        }
        default:
          result.message = `Unknown command type: ${cmd.type}`;
      }

      // Post-validation: evaluate and check for violations
      if (result.success) {
        const state = this.evaluate(0);
        result.violations = state.violations;
        if (result.violations.length > 0) {
          result.message += ` (${result.violations.length} violation(s) detected)`;
        }
      }
    } catch (e) {
      result.message = `Command failed: ${e.message}`;
    }

    this._commandLog.push({ cmd, result, timestamp: Date.now() });
    return result;
  }

  getCommandLog() {
    return this._commandLog;
  }

  // --- Dependency graph introspection ------------------------------------
  getDependencyGraph() {
    const { constraints = [] } = this.spec;
    const g = {};
    for (const c of constraints) {
      const refs = new Set();
      if (c.x) extractDeps(c.x).forEach(d => { if (d !== c.target) refs.add(d); });
      if (c.y) extractDeps(c.y).forEach(d => { if (d !== c.target) refs.add(d); });
      if (c.width) extractDeps(c.width).forEach(d => { if (d !== c.target) refs.add(d); });
      if (c.height) extractDeps(c.height).forEach(d => { if (d !== c.target) refs.add(d); });
      g[c.target] = Array.from(refs);
    }
    return g;
  }
}

// --- Connection site resolver ----------------------------------------------
function getConnectionSite(m, site) {
  const b = m.bounds || { left: m.x, right: m.x + (m.width || 0), top: m.y, bottom: m.y + (m.height || 0) };
  switch (site) {
    case 'top': return { x: (b.left + b.right) / 2, y: b.top };
    case 'bottom': return { x: (b.left + b.right) / 2, y: b.bottom };
    case 'left': return { x: b.left, y: (b.top + b.bottom) / 2 };
    case 'right': return { x: b.right, y: (b.top + b.bottom) / 2 };
    case 'center': return { x: (b.left + b.right) / 2, y: (b.top + b.bottom) / 2 };
    default: return { x: b.right, y: (b.top + b.bottom) / 2 };
  }
}

        {id:'h1',type:'text_box',x:startX,y:startY,width:colW,content:'Constraint-Based',font:'18px DM Sans',lineHeight:1.3,color:  '#7eb8ff'},
        {id:'b1',type:'text_box',x:startX,y:0,width:colW,content:'DAG solver resolves spatial relationships in topological order. Single-pass. O(V+E). No iteration.',font:'14px DM Sans',lineHeight:1.6,color:'#8888a0'},
        {id:'h2',type:'text_box',x:0,y:startY,width:colW,content:'Measurement-Driven',font:'18px DM Sans',lineHeight:1.3,color:'#4ecdc4'},
        {id:'b2',type:'text_box',x:0,y:0,width:colW,content:'Real rendered measurements feed back into the constraint system. Text reflow drives layout — not the other way around.',font:'14px DM Sans',lineHeight:1.6,color:'#8888a0'},
        {id:'h3',type:'text_box',x:0,y:startY,width:colW,content:'Agent-Native',font:'18px DM Sans',lineHeight:1.3,color:'#ff6b6b'},
        {id:'b3',type:'text_box',x:0,y:0,width:colW,content:'Mode C parametric programs let AI agents manipulate layout intent — not pixel coordinates. Violation feedback enables retry loops.',font:'14px DM Sans',lineHeight:1.6,color:'#8888a0'},
        // Divider lines
        {id:'div1',type:'line',x:0,y:startY-10,x2:0,y2:420,stroke:'rgba(126,184,255,0.15)',stroke_width:1},
        {id:'div2',type:'line',x:0,y:startY-10,x2:0,y2:420,stroke:'rgba(126,184,255,0.15)',stroke_width:1}
      ],
      animations:[],
      constraints:[
        {target:'b1',y:'h1.bounds.bottom + 12',x:'h1.x'},
        {target:'h2',x:`h1.bounds.right + ${gap}`},
        {target:'b2',y:'h2.bounds.bottom + 12',x:'h2.x'},
        {target:'h3',x:`h2.bounds.right + ${gap}`},
        {target:'b3',y:'h3.bounds.bottom + 12',x:'h3.x'},
        {target:'div1',x:`h2.x - ${gap/2}`,y:`${startY - 10}`},
        {target:'div2',x:`h3.x - ${gap/2}`,y:`${startY - 10}`}
      ]
    };
  };

  const autoFrameSpec = () => {
    const sp=val('frameSpacing'), pad=val('framePadding');
    const dir=document.getElementById('frameDir').value;
    const pAlign=document.getElementById('framePrimary').value;
    const cAlign=document.getElementById('frameCounter').value;
    return {
      metadata:{width:canvas.width,height:canvas.height,duration_ms:0,frame_rate:60,background:'#0d0d14'},
      elements:[
        {id:'frame1',type:'frame',x:60,y:60,width:500,height:380,direction:dir,spacing:sp,padding:pad,primaryAlign:pAlign,counterAlign:cAlign,children:['card1','card2','card3'],stroke:'rgba(126,184,255,0.2)',stroke_width:1},
        {id:'card1',type:'rectangle',x:0,y:0,width:140,height:100,fill:'rgba(126,184,255,0.12)',stroke:'rgba(126,184,255,0.3)',stroke_width:1,flexGrow:1},
        {id:'card2',type:'rectangle',x:0,y:0,width:140,height:80,fill:'rgba(78,205,196,0.12)',stroke:'rgba(78,205,196,0.3)',stroke_width:1,flexGrow:2},
        {id:'card3',type:'rectangle',x:0,y:0,width:140,height:120,fill:'rgba(255,107,107,0.12)',stroke:'rgba(255,107,107,0.3)',stroke_width:1,flexGrow:1},
        {id:'info',type:'text',x:60,y:480,content:`Frame: dir=${dir} spacing=${sp} pad=${pad} primary=${pAlign} counter=${cAlign}`,font:'12px JetBrains Mono',color:'#6a6a80'}
      ],
      animations:[],
      constraints:[]
    };
  };

  const connectorSpec = () => {
    return {
      metadata:{width:canvas.width,height:canvas.height,duration_ms:val('duration'),frame_rate:60,background:'#0d0d14'},
      elements:[
        {id:'a',type:'rectangle',x:100,y:200,width:120,height:70,fill:'rgba(126,184,255,0.15)',stroke:'rgba(126,184,255,0.4)',stroke_width:1},
        {id:'labelA',type:'text',x:0,y:0,content:'Source',font:'14px DM Sans',color:'#7eb8ff'},
        {id:'b',type:'rectangle',x:400,y:120,width:120,height:70,fill:'rgba(78,205,196,0.15)',stroke:'rgba(78,205,196,0.4)',stroke_width:1},
        {id:'labelB',type:'text',x:0,y:0,content:'Target A',font:'14px DM Sans',color:'#4ecdc4'},
        {id:'c',type:'rectangle',x:400,y:320,width:120,height:70,fill:'rgba(255,107,107,0.15)',stroke:'rgba(255,107,107,0.4)',stroke_width:1},
        {id:'labelC',type:'text',x:0,y:0,content:'Target B',font:'14px DM Sans',color:'#ff6b6b'},
        {id:'conn1',type:'connector',from:'a',to:'b',fromSite:'right',toSite:'left',stroke:'rgba(126,184,255,0.6)',stroke_width:2},
        {id:'conn2',type:'connector',from:'a',to:'c',fromSite:'right',toSite:'left',stroke:'rgba(255,107,107,0.5)',stroke_width:2}
      ],
      animations:[
        {target:'a',property:'x',easing:'ease_in_out',keyframes:[{time:0,value:100},{time:val('duration')/2,value:200},{time:val('duration'),value:100}]}
      ],
      constraints:[
        {target:'labelA',x:'a.centerX',y:'a.bounds.top - 18'},
        {target:'labelB',x:'b.centerX',y:'b.bounds.top - 18'},
        {target:'labelC',x:'c.centerX',y:'c.bounds.top - 18'}
      ]
    };
  };

  // --- Demo switcher -------------------------------------------------------
  function buildSpec() {
    const m = document.getElementById('demoSelect').value;
    if(m==='hero') return heroSpec();
    if(m==='chain') return chainSpec();
    if(m==='grid') return gridSpec();
    if(m==='threeCol') return threeColSpec();
    if(m==='autoframe') return autoFrameSpec();
    if(m==='connector') return connectorSpec();
    return slideSpec();
  }

  function showControlsForDemo(mode) {
    const panels = {heroControls:['hero'],chainControls:['chain'],gridControls:['grid'],slideControls:['slide','threeCol'],frameControls:['autoframe']};
    for(const [id,modes] of Object.entries(panels)) {
      const el = document.getElementById(id);
      if(el) el.style.display = modes.includes(mode) ? 'block' : 'none';
    }
  }

  // --- Engine init ---------------------------------------------------------
  let spec = buildSpec();
  let engine = new window.SpatialFlowEngine(spec, canvas);
  showControlsForDemo('slide');

  // --- Hover + inspector ---------------------------------------------------
  let mouse = {x:0,y:0};
  let lastState = null;
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * (canvas.width / r.width);
    mouse.y = (e.clientY - r.top) * (canvas.height / r.height);
  });

  function hitTest(state, x, y) {
    for(let i=state.elements.length-1;i>=0;i--){
      const el=state.elements[i]; const m=state.measurements[el.id]; if(!m) continue;
      const b=m.bounds;
      if(x>=b.left && x<=b.right && y>=b.top && y<=b.bottom) return el.id;
    }
    return null;
  }

  function drawInspector(state) {
    const id=hitTest(state,mouse.x,mouse.y);
    const box = document.getElementById('inspectorBox');
    if(!id) { box.textContent='Hover over an element'; return; }
    const m=state.measurements[id];
    const el=state.elements.find(e=>e.id===id);
    const c=(state.constraints||[]).find(cc=>cc.target===id);
    let info = `id: ${id}\ntype: ${el?.type}\n`;
    info += `x: ${m.x?.toFixed(1)}  y: ${m.y?.toFixed(1)}\n`;
    if(m.width) info += `w: ${m.width?.toFixed(1)}  h: ${m.height?.toFixed(1)}\n`;
    if(m.lines) info += `lines: ${m.lines.length}  lh: ${m.lineHeight?.toFixed(1)}\n`;
    if(c) {
      info += `\nConstraints:\n`;
      if(c.x) info += `  x = ${c.x}\n    → ${evalResolved(c.x, state.measurements)}\n`;
      if(c.y) info += `  y = ${c.y}\n    → ${evalResolved(c.y, state.measurements)}\n`;
    }
    box.textContent = info;

    // Highlight on canvas
    const b = m.bounds;
    ctx.save();
    ctx.strokeStyle='#ff2d55'; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
    ctx.strokeRect(b.left,b.top,b.right-b.left,b.bottom-b.top);
    ctx.setLineDash([]);
    ctx.fillStyle='#ff2d55'; ctx.beginPath(); ctx.arc(m.centerX||m.x,m.centerY||m.y,3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function evalResolved(expr, measurements) {
    try { return window.SF_evalExpr(expr, measurements)?.toFixed(2); }
    catch { return '?'; }
  }

  // --- DAG overlay ---------------------------------------------------------
  function drawDAG(state) {
    if(!document.getElementById('showDag').checked) return;
    const constraints=state.constraints||[];
    ctx.save(); ctx.lineWidth=1;
    for(const c of constraints) {
      const tm=state.measurements[c.target]; if(!tm) continue;
      const tpt={x:tm.centerX||tm.x, y:tm.centerY||tm.y};
      const deps=new Set();
      if(c.x) extractDeps(c.x).forEach(d=>{if(d!==c.target) deps.add(d);});
      if(c.y) extractDeps(c.y).forEach(d=>{if(d!==c.target) deps.add(d);});
      for(const r of deps){
        const rm=state.measurements[r]; if(!rm) continue;
        const rpt={x:rm.centerX||rm.x, y:rm.centerY||rm.y};
        ctx.strokeStyle='rgba(126,184,255,0.25)';
        ctx.beginPath(); ctx.moveTo(rpt.x,rpt.y); ctx.lineTo(tpt.x,tpt.y); ctx.stroke();
        // Arrow
        const dx=tpt.x-rpt.x, dy=tpt.y-rpt.y, len=Math.hypot(dx,dy)||1;
        const ux=dx/len, uy=dy/len;
        const ax=tpt.x-ux*8, ay=tpt.y-uy*8;
        ctx.beginPath(); ctx.moveTo(tpt.x,tpt.y);
        ctx.lineTo(ax-uy*3,ay+ux*3); ctx.lineTo(ax+uy*3,ay-ux*3); ctx.closePath();
        ctx.fillStyle='rgba(126,184,255,0.35)'; ctx.fill();
      }
    }
    ctx.restore();
  }

  function extractDeps(expr) {
    const ids=new Set();
    if(!expr) return ids;
    expr.replace(/([A-Za-z_][A-Za-z0-9_]*)\s*\./g,(_,g)=>{ ids.add(g); return _; });
    return ids;
  }

  // --- Bounds overlay ------------------------------------------------------
  function drawBounds(state) {
    if(!document.getElementById('showBounds').checked) return;
    ctx.save(); ctx.strokeStyle='rgba(200,200,216,0.08)'; ctx.lineWidth=0.5;
    for(const el of state.elements) {
      const m=state.measurements[el.id]; if(!m?.bounds) continue;
      const b=m.bounds;
      ctx.strokeRect(b.left,b.top,b.right-b.left,b.bottom-b.top);
    }
    ctx.restore();
  }

  // --- Violation overlay ---------------------------------------------------
  function drawViolations(state) {
    if(!document.getElementById('showViolations').checked) return;
    const box = document.getElementById('violationsBox');
    if(!state.violations?.length) { box.innerHTML='<em style="color:var(--text-dim);font-family:var(--mono);font-size:10px;">None</em>'; return; }
    let html='';
    ctx.save();
    for(const v of state.violations) {
      if(v.type==='overlap') {
        const ma=state.measurements[v.elements[0]], mb=state.measurements[v.elements[1]];
        if(ma?.bounds && mb?.bounds) {
          const l=Math.max(ma.bounds.left,mb.bounds.left), r=Math.min(ma.bounds.right,mb.bounds.right);
          const t=Math.max(ma.bounds.top,mb.bounds.top), bt=Math.min(ma.bounds.bottom,mb.bounds.bottom);
          ctx.fillStyle='rgba(255,180,50,0.06)'; ctx.fillRect(l,t,r-l,bt-t);
          ctx.strokeStyle='rgba(255,180,50,0.3)'; ctx.strokeRect(l,t,r-l,bt-t);
        }
        html+=`<div class="violation overlap">${v.elements[0]} ∩ ${v.elements[1]} (${Math.round(v.area)}px²)</div>`;
      } else if(v.type==='overflow') {
        html+=`<div class="violation overflow">${v.elementId} overflows slide</div>`;
      }
    }
    ctx.restore();
    box.innerHTML = html;
  }

  // --- Graph panel ---------------------------------------------------------
  function updateGraph(state) {
    const constraints=state.constraints||[];
    const order=state.order||[];
    const lines=[];
    for(const id of order) {
      const c=constraints.find(cc=>cc.target===id);
      if(!c) { lines.push(`${id}`); continue; }
      const deps=new Set();
      if(c.x) extractDeps(c.x).forEach(d=>{if(d!==id) deps.add(d);});
      if(c.y) extractDeps(c.y).forEach(d=>{if(d!==id) deps.add(d);});
      lines.push(`${id}  ←  ${Array.from(deps).join(', ')||'(root)'}`);
    }
    document.getElementById('graphBox').textContent=lines.join('\n');
  }

  // --- Animation loop ------------------------------------------------------
  let raf=null, t0=null, frameCount=0, lastFpsTime=0;

  function renderOnce() {
    const s=engine.renderFrame(0); lastState=s;
    drawBounds(s); drawDAG(s); drawInspector(s); drawViolations(s); updateGraph(s); updateStats(s);
  }

  function frame(ts) {
    const dur=spec.metadata.duration_ms;
    if(dur<=0) { renderOnce(); if(raf){cancelAnimationFrame(raf);raf=null;} return; }
    if(!t0) { t0=ts; lastFpsTime=ts; }
    const t=(ts-t0)%dur;
    const s=engine.renderFrame(t); lastState=s;
    drawBounds(s); drawDAG(s); drawInspector(s); drawViolations(s); updateGraph(s);

    frameCount++;
    if(ts-lastFpsTime>=1000) {
      document.getElementById('fpsDisplay').textContent=frameCount+' fps';
      frameCount=0; lastFpsTime=ts;
    }
    updateStats(s);
    raf=requestAnimationFrame(frame);
  }

  function start() { if(raf) cancelAnimationFrame(raf); t0=null; raf=requestAnimationFrame(frame); }
  function stop() { if(raf) cancelAnimationFrame(raf); raf=null; }

  function updateStats(s) {
    document.getElementById('elemCount').textContent=s.elements.length+' elements';
    document.getElementById('constraintCount').textContent=(s.constraints||[]).length+' constraints';
  }

  // --- UI bindings ---------------------------------------------------------
  document.getElementById('playBtn').onclick=start;
  document.getElementById('pauseBtn').onclick=stop;
  document.getElementById('seekBtn').onclick=()=>{ t0=null; };

  // All input controls trigger rebuild
  const allInputs=['duration','travel','offset','chainCount','chainGap','demoSelect','gridRows','gridCols','rowGap','colGap','slideTextWidth','slideTitleSize','slideBodySize','frameSpacing','framePadding','frameDir','framePrimary','frameCounter'];
  for(const id of allInputs) {
    const el=document.getElementById(id); if(!el) continue;
    el.addEventListener('input',()=>{
      const mode=document.getElementById('demoSelect').value;
      showControlsForDemo(mode);
      spec=buildSpec(); engine=new window.SpatialFlowEngine(spec,canvas); t0=null;
      if(spec.metadata.duration_ms<=0) { stop(); renderOnce(); } else { if(!raf) start(); }
    });
  }

  // --- Mode C command input ------------------------------------------------
  document.getElementById('cmdSend').onclick = () => {
    const input = document.getElementById('cmdInput');
    const logEl = document.getElementById('cmdLog');
    try {
      const cmd = JSON.parse(input.value);
      const result = engine.executeCommand(cmd);
      const cls = result.success ? 'ok' : 'err';
      logEl.innerHTML = `<div class="${cls}">${result.message}</div>` + logEl.innerHTML;
      if(result.success) {
        spec = engine.spec;
        t0=null;
        if(spec.metadata.duration_ms<=0) renderOnce(); else if(!raf) start(); else { /* already running */ }
      }
    } catch(e) {
      logEl.innerHTML = `<div class="err">Parse error: ${e.message}</div>` + logEl.innerHTML;
    }
  };

  // Ctrl+Enter to send
  document.getElementById('cmdInput').addEventListener('keydown', e => {
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); document.getElementById('cmdSend').click(); }
  });

  // --- Boot ----------------------------------------------------------------
  showControlsForDemo('slide');
  if(spec.metadata.duration_ms<=0) renderOnce(); else start();

})();
</script>
</body>
</html>
